# A local trial of the whole product: a database and the app in one command.
#   cp .env.example .env   (then edit it)
#   docker compose up --build
# Production uses a managed database with backups; see docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # The app reads and writes as a restricted role so tenant isolation always applies.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      # Migrations run as the owner of the tables.
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_FLYWAY_USER: ${POSTGRES_USER}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      SOCIETY_LEDGER_AUTH_SECRET: ${SOCIETY_LEDGER_AUTH_SECRET}
      SOCIETY_LEDGER_MAIL_ENABLED: ${SOCIETY_LEDGER_MAIL_ENABLED:-false}
      SOCIETY_LEDGER_MAIL_FROM: ${SOCIETY_LEDGER_MAIL_FROM:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}

volumes:
  pgdata:
