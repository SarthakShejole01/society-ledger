name: CI

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The database tests start a real PostgreSQL with Testcontainers; the runner has Docker.
      - name: Run tests
        run: ./gradlew test --no-daemon --console=plain
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests
          retention-days: 7

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps works around an npm install bug, the same flag the Dockerfile uses.
      - run: npm ci --legacy-peer-deps
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  image:
    name: Container image builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the single image (web app and API) to catch a broken Dockerfile. Nothing is published.
      - run: docker build -t society-ledger:ci .
